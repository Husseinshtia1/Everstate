name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Test
        run: pytest

  ruflo-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Everstate
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Validate real acceptance runner shell syntax
        run: |
          bash -n benchmarks/system_v1/pulseboard_autobuild/run_real.sh
          bash -n benchmarks/enterprise_agri_os/run_real.sh
      - name: Validate enterprise autobuild plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from everstate.phased_autobuild import AutobuildPlan
          plan = AutobuildPlan.load(Path("benchmarks/enterprise_agri_os/plan.json"))
          assert len(plan.stages) == 15
          assert plan.stages[0].id == "foundation"
          assert plan.stages[-1].id == "final-integration"
          assert all(stage.max_attempts >= 2 for stage in plan.stages)
          print(f"validated {plan.name}: {len(plan.stages)} stages")
          PY
      - name: Install Ruflo v3
        run: npm install -g 'claude-flow@^3'
      - name: Verify Ruflo readiness
        run: everstate ruflo-check --json
      - name: Exercise live Ruflo review and debate contracts
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from everstate.agent_council import CouncilMode, CouncilParticipant
          from everstate.continuity import ContinuationPacket
          from everstate.ruflo_orchestrator import RufloOrchestrator

          class Fabric:
              name = "ypipe"

          participants = (
              CouncilParticipant(role="architect", fabric=Fabric(), model="ci-a", local=True),
              CouncilParticipant(role="verifier", fabric=Fabric(), model="ci-b", local=True),
          )
          orchestrator = RufloOrchestrator()

          review_root = Path(tempfile.mkdtemp(prefix="everstate-ruflo-review-"))
          review = orchestrator.prepare_council(
              root=review_root,
              packet=ContinuationPacket(project_id="proj_ci_review", state_version=1),
              question="Validate Everstate Ruflo review contract",
              participants=participants,
              mode=CouncilMode.PARALLEL_REVIEW,
          )
          assert review.enabled and review.task_registered
          assert review.topology == "star"
          assert review.strategy == "analysis"
          assert review.task_strategy == "analysis"
          print("review", review)

          debate_root = Path(tempfile.mkdtemp(prefix="everstate-ruflo-debate-"))
          debate = orchestrator.prepare_council(
              root=debate_root,
              packet=ContinuationPacket(project_id="proj_ci_debate", state_version=1),
              question="Debate the Everstate Ruflo orchestration boundary",
              participants=participants,
              mode=CouncilMode.DEBATE,
          )
          assert debate.enabled and debate.task_registered
          assert debate.topology == "mesh"
          assert debate.strategy == "balanced"
          assert debate.task_strategy == "balanced"
          print("debate", debate)
          PY

  codex-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Everstate
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Install current verified Codex CLI
        run: npm install -g '@openai/codex@0.154.0'
      - name: Verify Codex version
        run: codex --version
      - name: Verify Everstate automation flags parse without inference
        shell: bash
        run: |
          codex \
            -c 'approval_policy="never"' \
            -c 'sandbox_workspace_write.network_access=false' \
            exec \
            --sandbox workspace-write \
            --ephemeral \
            --help >/dev/null
      - name: Verify Everstate command contract matches the live CLI
        shell: bash
        run: |
          python - <<'PY'
          from everstate.providers import get_provider
          command = get_provider("codex").automation_command("REAL_ACCEPTANCE_PROMPT")
          assert command[1:-1] == [
              "-c", 'approval_policy="never"',
              "-c", "sandbox_workspace_write.network_access=false",
              "exec", "--sandbox", "workspace-write", "--ephemeral",
          ]
          assert command[-1] == "REAL_ACCEPTANCE_PROMPT"
          print("Codex automation contract verified")
          PY
