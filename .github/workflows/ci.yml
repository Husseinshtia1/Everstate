name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Test
        run: pytest

  ruflo-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Everstate
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Install Ruflo v3
        run: npm install -g 'claude-flow@^3'
      - name: Verify Ruflo readiness
        run: everstate ruflo-check --json
      - name: Exercise live Ruflo swarm contract
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from everstate.agent_council import CouncilMode, CouncilParticipant
          from everstate.continuity import ContinuationPacket
          from everstate.ruflo_orchestrator import RufloOrchestrator

          class Fabric:
              name = "ypipe"

          root = Path(tempfile.mkdtemp(prefix="everstate-ruflo-"))
          packet = ContinuationPacket(project_id="proj_ci_ruflo", state_version=1)
          participants = (
              CouncilParticipant(role="architect", fabric=Fabric(), model="ci-a", local=True),
              CouncilParticipant(role="verifier", fabric=Fabric(), model="ci-b", local=True),
          )
          run = RufloOrchestrator().prepare_council(
              root=root,
              packet=packet,
              question="Validate Everstate Ruflo orchestration contract",
              participants=participants,
              mode=CouncilMode.PARALLEL_REVIEW,
          )
          assert run.enabled
          assert run.task_registered
          assert run.topology == "star"
          assert run.strategy == "analysis"
          assert run.task_strategy == "analysis"
          print(run)
          PY
